[package]
name = "sonar"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures-core = "0.3.34"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toasty = { version = "=0.7.0", features = ["sqlite"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "=0.6.2", features = ["sse"] }
